[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymaslow"
version = "0.4.0"
description = "Temporal Maslow Hierarchy: computational tools for modeling diurnal rhythms of human motivational needs from activity data"
readme = "README.md"
license = "MIT"
authors = [
    { name = "HongSheng Qi", email = "qihongsheng@zju.edu.cn" },
]
maintainers = [
    { name = "HongSheng Qi", email = "qihongsheng@zju.edu.cn" },
]
requires-python = ">=3.9"
keywords = [
    "maslow",
    "hierarchy of needs",
    "human behavior",
    "activity recognition",
    "circular statistics",
    "von mises",
    "dirichlet",
    "hidden markov model",
    "affective computing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "matplotlib>=3.5",
    "tqdm>=4.60",
]

[project.optional-dependencies]
plot = ["networkx>=2.6"]
test = ["pytest>=7.0"]
all = ["networkx>=2.6", "pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/QHS2020/pymaslow"
Repository = "https://github.com/QHS2020/pymaslow"
Issues = "https://github.com/QHS2020/pymaslow/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pymaslow"]

[tool.hatch.build.targets.sdist]
include = ["src/pymaslow", "tests", "README.md", "LICENSE"]
